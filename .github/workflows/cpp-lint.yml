name: C/C++ Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure CMake
        # Export compile commands so clang-tidy knows the exact flags for each TU.
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run clang-tidy
        # Extract first-party TUs from compile_commands.json with jq (excluding
        # anything under _deps/), then hand that list to run-clang-tidy as
        # positional arguments — the only supported way to filter sources.
        run: |
          mapfile -t FILES < <(
            jq -r '.[].file | select(contains("/_deps/") | not)' build/compile_commands.json
          )
          run-clang-tidy -p build -quiet "${FILES[@]}"
