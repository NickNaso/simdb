name: C/C++ Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure CMake
        # Export compile commands so clang-tidy knows the exact flags for each TU.
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        # run-clang-tidy reads compile_commands.json and spawns clang-tidy only
        # on the translation units listed there.  The -source-filter regex keeps
        # us away from FetchContent'd third-party code under _deps/.
        run: |
          run-clang-tidy \
            -p build \
            -source-filter '^((?!/_deps/).)*\.cpp$' \
            -quiet
