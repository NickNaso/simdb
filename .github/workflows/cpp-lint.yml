name: C/C++ Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
        
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        
      - name: Run clang-tidy
        # Drive the file list directly from compile_commands.json so that only files 
        # with compilation flags are analyzed, avoiding errors on standalone headers
        run: |
          jq -r '.[].file' build/compile_commands.json | xargs -d '\n' clang-tidy -p build/
